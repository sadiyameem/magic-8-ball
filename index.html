<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Magic 8 Ball</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>🎱 Magic 8 Ball 🎱</h1>
        <p>Type your question and the ball will give you the answer</p>
        <div id="container">
            <div id="ball">
                <div id="ball-number">8</div>
            </div>
            <div class="questionBox">
                <h3>Type your question:</h3>
                <input type="text" name="fortuneQuestion"
                id="fortuneQuestion" placeholder="Enter a question here"/>
            </div>
            <div id="answer"></div>
        </div>
    </body>
    <script src="script.js"></script>
</html>
